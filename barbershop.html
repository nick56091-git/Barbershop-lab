<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barbershop Quartet Lab</title><style> *{box-sizing:border-box}body{font:15px system-ui;background:#f3f5f7;color:#243447;max-width:1000px;margin:auto;padding:18px}h1{font-size:25px}section,article{background:white;border:1px solid #dce2e8;border-radius:14px;padding:16px;margin:12px 0}label{display:block;margin:8px 0}select,button{font:inherit;padding:9px;border:1px solid #ccd5df;border-radius:8px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#167d68;color:white}input[type=range]{width:100%;accent-color:#167d68}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.grid article{margin:0;border-left:5px solid var(--c)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}small{color:#64748b}canvas{width:100%;height:250px}summary{cursor:pointer;padding:10px 0}header{position:sticky;top:0;background:#f3f5f7;z-index:2;padding:8px 0}output{float:right} </style><h1>Barbershop Quartet Lab</h1><small>Human voice synthesis · 4-part acoustic laboratory</small><header class="row"><button class="primary" id="play">▶ 再生</button><button id="stop">■ 停止</button><button id="reset">初期化</button><span id="status" aria-live="polite">停止中</span></header><section><div class="row"><select id="chord"></select><select id="voicing"></select><select id="tuning"><option value="just">純正律</option><option value="equal">十二平均律</option></select><select id="mode"><option value="human">人間らしい歌声</option><option value="ideal">理想周期音</option></select></div><div id="global"></div><label>全員の母音 <select id="allv"></select></label><label>声質プリセット <select id="preset"><option value="">選択</option><option value="4,1,1,0">Bass主導</option><option value="1,1,1,1">全員まろやか</option><option value="4,4,4,4">全員倍音豊富</option><option value="2,3,3,3">共鳴重視</option><option value="0,0,0,0">全員柔らかい</option></select></label><label>音量バランス <select id="balance"><option value="">選択</option><option value="0,0,0,0">均等</option><option value="3,-3,0,-6">Bass強め</option><option value="0,-4,3,-5">Lead強め</option><option value="0,-6,-4,-8">上3声控えめ</option></select></label></section><div class="grid" id="parts"></div><section><h3>倍音スペクトル</h3><canvas id="plot"></canvas><p id="metrics"></p><small>中心音高の理論値。共有判定は0.5 Hz以内。位相・雑音を含まない。</small></section><section><h3>母音空間 F1 / F2</h3><canvas id="vplot"></canvas></section><script>
const $=x=>document.getElementById(x),names=['Bass','Baritone','Lead','Tenor'],colors=['#16856b','#b77928','#3979bc','#a17ac8'];
const vowels=[['ɑ','father',750,1150],['æ','cat',700,1800],['ɛ','bed',550,1850],['e','エ',430,2100],['i','see',280,2300],['ɪ','sit',400,1900],['ɔ','law',550,900],['o','オ',400,850],['u','food',300,800],['ʌ','cup',600,1250],['ə','about',500,1450]];
const types=['透明・柔らかい','まろやか','豊か','輝き・共鳴型','硬い・倍音豊富'],tilts=[15,10,6,8,2],profiles=[[.91,.49,.79,.012,4.7],[.97,.57,.73,.018,5.1],[1.01,.53,.81,.009,5.4],[1.08,.65,.69,.023,5.7]],people=['深く落ち着いた声','温かく柔軟な声','明瞭で芯のある声','軽く透明感のある声'];
const tri=[[0,7,12,16],[7,12,16,19],[4,7,12,16]],chords=[tri,tri.map(a=>a.map(n=>n===4||n===16?n-1:n)),[[0,4,7,10],[0,7,10,16],[7,10,12,16]]],rat={0:1,3:1.2,4:1.25,7:1.5,10:1.75,12:2,15:2.4,16:2.5,19:3},sol={0:'ド1',3:'ミ♭1',4:'ミ1',7:'ソ1',10:'シ♭1',12:'ド2',15:'ミ♭2',16:'ミ2',19:'ソ2'};
const initial=()=>({chord:0,voicing:0,tuning:'just',mode:'human',volume:20,human:20,individual:100,v:names.map((_,i)=>({on:true,person:i,type:[2,1,1,0][i],vowel:0,fs:[750,1150],db:0,form:[0,0,0,0,0]}))});let s=initial();try{let a=JSON.parse(localStorage.getItem('quartet-v1'));if(a&&a.v?.length===4)s=a}catch{}let ctx,master,nodes=[],timer,playing=false,starting=false;
const gain=d=>10**(d/20),opts=a=>a.map((x,i)=>`<option value="${i}">${x}</option>`).join(''),slider=(id,label,min,max,step=1)=>`<label>${label}<output id="${id}out"></output><input id="${id}" type="range" min="${min}" max="${max}" step="${step}"></label>`;
$('chord').innerHTML=opts(['Major','Minor','Dominant 7th']);$('allv').innerHTML='<option value="">選択</option>'+opts(vowels.map(v=>`/${v[0]}/ ${v[1]}`));$('global').innerHTML=slider('volume','マスター音量',0,100)+slider('human','人間らしい揺らぎ',0,100)+slider('individual','個人差',0,100);
function f0(i){let n=chords[s.chord][s.voicing][i];return 130.8128*(s.tuning==='just'?rat[n]:2**(n/12))}function profile(i){let p=profiles[s.v[i].person],a=s.mode==='human'?s.individual/100:0;return p.map((x,k)=>[1,.56,.75,.015,5.2][k]+a*(x-[1,.56,.75,.015,5.2][k]))}function fs(i){let v=s.v[i];return [...v.fs,v.type===3?2800:2700,3500,4500].map(f=>f*profile(i)[0])}function coeff(i){let v=s.v[i],p=profile(i),F=fs(i),t=tilts[v.type],g=[1,.65,v.type===3?1.5:.45,v.type===3?.65:.22,.12],b=[150,220,v.type===3?220:350,450,600],a=[],N=128,flow=Array.from({length:N},(_,j)=>{let x=j/N,oq=Math.max(.32,Math.min(.82,p[1]+(t-8)*.009)),peak=oq*p[2];return x<peak?.5-.5*Math.cos(Math.PI*x/peak):x<oq?Math.cos(Math.PI/2*(x-peak)/(oq-peak)):0});let base=1;for(let h=1;h*f0(i)<=8000;h++){let f=h*f0(i),r=0,m=0;for(let k=0;k<5;k++){let x=(f-F[k])/(b[k]/2),z=g[k]*gain(v.form[k]);if(s.mode==='human'){r+=z/(1+x*x);m-=z*x/(1+x*x)}else r+=z/Math.sqrt(1+x*x)}let sr=0,si=0;for(let j=0;j<N;j++){sr+=flow[j]*Math.cos(2*Math.PI*h*j/N);si-=flow[j]*Math.sin(2*Math.PI*h*j/N)}let mag=Math.hypot(sr,si)||1e-9;if(h===1)base=mag;let slope=h**(-t/6.0206),amp=slope*Math.sqrt(Math.max(.25,Math.min(4,mag/base/slope)));if(s.mode==='ideal'){sr=0;si=slope}else{sr=sr/mag*amp;si=si/mag*amp}let re=sr*r-si*m,im=sr*m+si*r;a.push({f,h,re,im,a:Math.hypot(re,im)})}let rms=Math.sqrt(a.reduce((z,x)=>z+x.a*x.a/2,0))||1;return a.map(x=>({...x,re:x.re/rms,im:x.im/rms,a:x.a/rms*gain(v.db)}))}
for(let i=3;i>=0;i--){let el=document.createElement('article');el.style.setProperty('--c',colors[i]);el.innerHTML=`<h3><label><input type="checkbox" id="on${i}"> ${names[i]} <small id="note${i}"></small></label></h3><label>歌手 <select id="person${i}">${opts(people)}</select></label><label>声質 <select id="type${i}">${opts(types)}</select></label><label>母音 <select id="vowel${i}">${opts(vowels.map(v=>`/${v[0]}/ ${v[1]}`))}</select></label>${slider('db'+i,'音量 (dB)',-30,6)}<details><summary>母音の微調整</summary>${slider('fs'+i+'0','F1 (Hz)',200,1100,10)}${slider('fs'+i+'1','F2 (Hz)',600,3000,10)}</details><details><summary>フォルマント相対パワー</summary>${Array.from({length:5},(_,k)=>slider('form'+i+k,'F'+(k+1)+' (dB)',-18,18)).join('')}<small id="power${i}"></small></details>`;$('parts').append(el);for(let key of ['person','type','vowel','db','on'])$(key+i).oninput=e=>{let v=s.v[i];v[key]=key==='on'?e.target.checked:+e.target.value;if(key==='vowel')v.fs=vowels[v.vowel].slice(2);if(key==='type')v.form.fill(0);refresh()};for(let key of ['fs','form'])for(let k=0;k<(key==='fs'?2:5);k++)$(key+i+k).oninput=e=>{let v=s.v[i];v[key][k]=+e.target.value;if(key==='fs'&&v.fs[0]>=v.fs[1])v.fs[k]=k?v.fs[0]+10:v.fs[1]-10;refresh()}}
function set(id,v,out=v){$(id).value=v;if($(id+'out'))$(id+'out').textContent=out}function refresh(){for(let key of ['chord','voicing','tuning','mode','volume','human','individual'])set(key,s[key]);$('voicing').innerHTML=opts(s.chord===2?['基本','バーバーショップ','クローズドセブンス']:['基本','5度強調','不安定']);$('voicing').value=s.voicing;s.v.forEach((v,i)=>{for(let key of ['person','type','vowel','db'])set(key+i,v[key]);$('on'+i).checked=v.on;$('note'+i).textContent=sol[chords[s.chord][s.voicing][i]]+' '+f0(i).toFixed(1)+' Hz';for(let k=0;k<2;k++)set('fs'+i+k,v.fs[k],Math.round(fs(i)[k]));for(let k=0;k<5;k++)set('form'+i+k,v.form[k]);let g=[1,.65,v.type===3?1.5:.45,v.type===3?.65:.22,.12].map((x,k)=>(x*gain(v.form[k]))**2),sum=g.reduce((a,b)=>a+b);$('power'+i).textContent=g.map((x,k)=>`F${k+1}: ${(100*x/sum).toFixed(1)}%`).join(' / ')});try{localStorage.setItem('quartet-v1',JSON.stringify(s))}catch{}draw();sound()}
for(let key of ['chord','voicing','tuning','mode','volume','human','individual'])$(key).oninput=e=>{s[key]=['tuning','mode'].includes(key)?e.target.value:+e.target.value;if(key==='chord')s.voicing=0;refresh()};$('allv').onchange=e=>{if(e.target.value==='')return;s.v.forEach(v=>{v.vowel=+e.target.value;v.fs=vowels[v.vowel].slice(2)});refresh()};for(let [id,key] of [['preset','type'],['balance','db']])$(id).onchange=e=>{if(!e.target.value)return;e.target.value.split(',').forEach((x,i)=>{s.v[i][key]=+x;if(key==='type')s.v[i].form.fill(0)});refresh()};
function canvas(id){let c=$(id),w=c.clientWidth,h=250,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;let g=c.getContext('2d');g.scale(d,d);g.font='11px system-ui';return[g,w,h]}function draw(){let [g,w,h]=canvas('plot'),X=f=>35+f/5000*(w-48),Y=d=>15+(12-d)/72*205,all=[];g.fillStyle='#64748b';for(let f=0;f<=5000;f+=1000){g.fillText(f,X(f)-10,240);g.strokeStyle='#e2e8f0';g.beginPath();g.moveTo(X(f),15);g.lineTo(X(f),220);g.stroke()}for(let d=-60;d<=0;d+=20)g.fillText(d,2,Y(d));s.v.forEach((v,i)=>{if(v.on)coeff(i).filter(x=>x.f<=5000).forEach(x=>all.push({...x,i}))});all.sort((a,b)=>a.f-b.f);let groups=[];all.forEach(x=>{let l=groups.at(-1);if(l&&x.f-l[0].f<=.5)l.push(x);else groups.push([x])});let shared=groups.filter(a=>new Set(a.map(x=>x.i)).size>1);g.fillStyle='#e8c65c44';shared.forEach(a=>g.fillRect(X(a[0].f)-3,15,6,205));all.forEach(x=>{g.strokeStyle=colors[x.i];g.beginPath();g.moveTo(X(x.f)+x.i-1.5,220);g.lineTo(X(x.f)+x.i-1.5,Y(Math.max(-60,Math.min(12,20*Math.log10(x.a)))));g.stroke()});let sum=a=>a.reduce((z,x)=>z+x.a*x.a,0);$('metrics').textContent=`共有倍音 ${shared.length}群 / エネルギー比 ${sum(all)?(100*sum(shared.flat())/sum(all)).toFixed(1):0}%`;[g,w,h]=canvas('vplot');X=f=>35+(3400-f)/2900*(w-50);Y=f=>20+(f-150)/1100*205;g.fillStyle='#64748b';for(let f=500;f<=3000;f+=500)g.fillText(f,X(f)-10,12);for(let f=200;f<=1200;f+=200)g.fillText(f,0,Y(f));vowels.forEach(v=>g.fillText(v[0],X(v[3]),Y(v[2])));s.v.forEach((v,i)=>{if(!v.on)return;let f=fs(i);g.strokeStyle=colors[i];g.lineWidth=2;g.beginPath();g.arc(X(f[1]),Y(f[0]),5+i*3,0,7);g.stroke();g.fillStyle=colors[i];g.fillText(names[i],X(f[1])+12,Y(f[0])+i*12)});}
function sound(){if(!playing)return;let now=ctx.currentTime;master.gain.setTargetAtTime(s.volume/100,now,.03);nodes.forEach((n,i)=>{let a=coeff(i),re=new Float32Array(a.length+1),im=new Float32Array(a.length+1);a.forEach(x=>{let p=x.h*n.phase;re[x.h]=x.re*Math.cos(p)-x.im*Math.sin(p);im[x.h]=-x.re*Math.sin(p)-x.im*Math.cos(p)});n.o.setPeriodicWave(ctx.createPeriodicWave(re,im,{disableNormalization:true}));n.o.frequency.setTargetAtTime(f0(i),now,.03);n.g.gain.setTargetAtTime(s.v[i].on?.035*gain(s.v[i].db):0,now,.04);n.ng.gain.setTargetAtTime(s.v[i].on&&s.mode==='human'?.035*gain(s.v[i].db)*profile(i)[3]*s.human/100:0,now,.04)})}
$('play').onclick=async()=>{if(playing||starting)return;starting=true;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);nodes=s.v.map((v,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),noise=ctx.createBufferSource(),ng=ctx.createGain(),bp=ctx.createBiquadFilter(),buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),a=buf.getChannelData(0);for(let j=0;j<a.length;j++)a[j]=Math.random()*2-1;noise.buffer=buf;noise.loop=true;bp.type='bandpass';bp.frequency.value=1600+i*300;bp.Q.value=.7;g.gain.value=ng.gain.value=0;o.frequency.value=f0(i);o.connect(g).connect(master);noise.connect(bp).connect(ng).connect(master);return{o,g,noise,ng,phase:Math.random()*6.28}});playing=true;sound();nodes.forEach(n=>{n.o.start();n.noise.start()});timer=setInterval(()=>{let t=ctx.currentTime,h=s.mode==='human'?s.human/100:0;nodes.forEach((n,i)=>{let p=profile(i),c=h*(2.8*Math.sin(t*p[4]*6.28+n.phase)+1.8*Math.sin(t*4.4+n.phase)+1.7*(Math.random()*2-1));n.o.frequency.setTargetAtTime(f0(i)*2**(c/1200),t,.018);n.g.gain.setTargetAtTime(s.v[i].on?.035*gain(s.v[i].db)*(1+h*.05*Math.sin(t*19+n.phase)):0,t,.025)})},35);$('status').textContent='再生中'}catch(e){$('status').textContent='再生エラー: '+e.message;playing=false}finally{starting=false}};function stop(){if(!playing)return;clearInterval(timer);let m=master,old=nodes;old.forEach(n=>{n.g.gain.setTargetAtTime(0,ctx.currentTime,.03);n.ng.gain.setTargetAtTime(0,ctx.currentTime,.03);n.o.stop(ctx.currentTime+.2);n.noise.stop(ctx.currentTime+.2)});old[0].o.onended=()=>m.disconnect();playing=false;nodes=[];$('status').textContent='停止中'}$('stop').onclick=stop;$('reset').onclick=()=>{s=initial();refresh()};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});window.addEventListener('resize',draw);refresh();
</script></html>
